# Venture Factory settings. Every value here has a NOTES.md entry explaining the default.
fx_zar:                     # rand per unit of currency (API spend is billed in USD)
  ZAR: 1.00
  USD: 18.50
  GBP: 24.50
  EUR: 21.50
  AUD: 12.00
  CAD: 13.50
niche_limit: 5              # first-run constraint: only the first N niches in niches.yaml are active

models:
  scout: claude-haiku-4-5     # scouts, distill, Deep Dive query planner
  judge: claude-sonnet-4-6    # gatekeepers, Deep Dive analysts, page and spec writers

# USD per million tokens (input, output). Opus is deliberately absent: never Opus.
pricing:
  claude-haiku-4-5: [1.00, 5.00]
  claude-sonnet-4-6: [3.00, 15.00]

caps:
  scout_zar_per_niche: 0.60   # per niche per night (distill call)
  stage_zar: 20.00            # stop a stage if it would cost more than this
  cards_per_niche: 5
  signals_to_distill: 25      # top-ranked signals sent to Haiku per niche
  signal_chars: 700           # truncation per signal in the distill prompt
  dive_zar_per_card: 1.50     # Deep Dive spend per card (planner + 2 Sonnet analysts)
  niche_capital_zar: 10000    # most a niche may ask for to start; above it the Economics gate kills
  training_zar_per_squad: 12  # Training spend per winning niche (writers, exams, one retake)

retention_days: 30            # raw Signal rows

thresholds:
  proof_min_score: 6
  craft_min_score: 6
  dive_min_score: 7
  max_break_even_sales: 80    # sales needed to earn back the start-up capital
  win_buy_click_rate: 0.05
  win_min_visitors: 150

smoke:
  budget_zar: 200
  duration_hours: 48
  variants: 3

sources:                      # Research scouts. appstore needs no key.
  reddit: true
  hn: true
  appstore: true              # 1-2 star reviews of the niche's named competitor apps
  upwork: false
  fiverr: false
  hellopeter: false
  trends: false

reddit:
  lookback: year              # reddit time_filter
  per_query_limit: 25
  request_pause_s: 2.0
hn:
  lookback_days: 365
  hits_per_query: 20

markets:                      # where Deep Dive measures demand (global by default)
  appstore_countries: [us, gb, au, ca, de]
  ebay_marketplaces: [EBAY_US, EBAY_GB, EBAY_DE, EBAY_AU]
  listings_per_probe: 10
  reviews_per_app: 20

dive:
  search_terms: 3             # planned by Haiku per card
  evidence_items: 24          # most listings shown to the Economics analyst

warden:                       # Phase 3. The Warden reads these; it never writes them.
  daily_cap_zar: 50           # most the factory may spend on agents per SAST day; only you can raise it
  check_every_min: 15         # health check cadence
  stale_run_hours: 2          # a job still "running" after this long died with its process
  retry_delay_s: 60           # wait before retrying sources that hit a rate limit or server error
  hold_after_runs: 2          # pause a source after it failed in every niche on this many runs in a row
  hold_hours: 24              # how long a paused source sits out
  missed_night_after: "03:30" # SAST; no scouting run by then means the night is caught up once
  stuck_funding_days: 7       # a smoke test waiting for your R200 longer than this is flagged
  silent_test_hours: 24       # a funded test with 0 visitors after this long needs you
  spend_spike_ratio: 2.0      # tonight above this multiple of the 7-night average is flagged
  report_day: mon             # weekly report (SAST)
  report_time: "07:00"

schedule:                     # Africa/Johannesburg (SAST)
  scout: "01:00"
  gates: "02:00"              # gates, then Deep Dive, then smoke prep
