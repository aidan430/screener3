<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:transparent}</style></head>
<body>
<script src="three.min.js"></script>
<script src="needles_data.js"></script><script src="shapes_data.js"></script>
<script>
// A port of shared/NeedleLook.luau: the same pieces, sizes and colour patterns.
let DATA = null;
const W = 360, H = 220;
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.outputEncoding = THREE.sRGBEncoding; renderer.setClearColor(0x000000, 0);
document.body.appendChild(renderer.domElement);
const lin = (c) => new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
const hsv = (h, s, v) => { const c = new THREE.Color(); c.setHSL(h, s, v * (1 - s / 2)); return c.convertSRGBToLinear(); };
let FAT0 = 2.2, FAT = 2.2;
function build(typeId, skinId) {
  const skin = DATA.skins.find(s => s.id === skinId); FAT = FAT0 * (skin.thin || 1);
  const group = new THREE.Group();
  const A = lin(skin.colours[0]), B = lin(skin.colours[1] || skin.colours[0]);
  const colourAt = (i, n) => {
    const t = (i - 0.5) / n, P = skin.pattern, C = skin.colours;
    if (P === 'stripes') return i % 2 === 1 ? A : B;
    if (P === 'gradient') return A.clone().lerp(B, t);
    if (P === 'rainbow') return hsv(t * 0.85, 0.65, 1);
    if (P === 'bands') return i % 3 === 0 ? B : A;
    if (P === 'sheen') return A.clone().lerp(B, 1 - Math.abs(2 * t - 1));
    if (P === 'split') return t < 0.5 ? A : B;
    if (P === 'tri') return lin(C[Math.min(2, Math.floor(t * 2))] || C[0]);
    if (P === 'candy') return lin(C[(i - 1) % C.length]);
    if (P === 'fleck') return (i * 5) % 7 < 2 ? lin(C[1 + i % Math.max(1, C.length - 1)] || C[0]) : A;
    if (P === 'wave') return A.clone().lerp(B, 0.5 + 0.5 * Math.sin(t * Math.PI * 5));
    return A;
  };
  const accent = () => skin.pattern === 'rainbow' ? hsv(0.85, 0.5, 1) : skin.pattern === 'tri' ? lin(skin.colours[2] || skin.colours[1] || skin.colours[0]) : (skin.pattern === 'solid' ? A : B);
  const mat = (colour) => {
    const m = { color: colour, roughness: 0.4, metalness: 0 };
    if (skin.material === 'Metal') { m.metalness = 0.8; m.roughness = 0.28; }
    if (skin.material === 'Neon') { m.emissive = colour; m.emissiveIntensity = 0.75; if (skin.see) { m.transparent = true; m.opacity = 1 - skin.see + 0.15; } }
    if (skin.material === 'Glass' || skin.material === 'Ice') { m.roughness = 0.08; m.metalness = 0.1; m.transparent = true; m.opacity = skin.see ? 1 - skin.see + 0.08 : 0.82; }
    if (skin.material === 'Wood') m.roughness = 0.85;
    if (skin.material === 'Foil' || skin.material === 'DiamondPlate') { m.metalness = 0.7; m.roughness = 0.35; }
    if (skin.material === 'Sand' || skin.material === 'Slate' || skin.material === 'Fabric') m.roughness = 0.95;
    if (skin.material === 'Marble') m.roughness = 0.2;
    return new THREE.MeshStandardMaterial(m);
  };
  const geo = { Block: new THREE.BoxGeometry(1, 1, 1), Ball: new THREE.SphereGeometry(0.5, 20, 14), Cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 20).rotateZ(-Math.PI / 2) };
  const part = (size, x, y, colour, shape, rotZ, onCurve, keep) => { const m = new THREE.Mesh(geo[shape || 'Block'], mat(colour)); if (keep) m.scale.set(size[0], size[1], size[2]); else if (shape === 'Ball') m.scale.set(size[0] * FAT, size[1] * FAT, size[2] * FAT); else m.scale.set(size[0], size[1] * FAT, size[2] * FAT); m.position.set(x, onCurve ? y : y * FAT, 0); if (rotZ) m.rotation.z = rotZ; group.add(m); return m; };
  const shaft = (x0, x1, d, n, y, flat) => { const len = (x1 - x0) / n; for (let i = 1; i <= n; i++) { if (flat) part([len + 0.01, d, flat], x0 + (i - 0.5) * len, y || 0, colourAt(i, n)); else part([len + 0.01, d, d], x0 + (i - 0.5) * len, y || 0, colourAt(i, n), 'Cylinder'); } };
  const tip = (x, d, steps) => { for (let i = 1; i <= steps; i++) { const k = 1 - i / (steps + 1); part([0.08, d * k, d * k], x + i * 0.07, 0, colourAt(6, 6), 'Cylinder'); } };
  const eye = (x, len, gap, d) => { for (const s of [-1, 1]) part([len, d * 0.45, d * 0.45], x, s * gap, accent(), 'Cylinder'); part([d * 0.6, gap * 2 + d * 0.45, d * 0.5], x - len / 2, 0, accent()); };
  const ball = (x, d, y, onCurve) => part([d, d, d], x, y || 0, accent(), 'Ball', 0, onCurve);
  const t = typeId;
  if (t === 'pin') { shaft(-0.75, 0.85, 0.06, 6); tip(0.85, 0.06, 2); ball(-0.85, 0.28); }
  else if (t === 'quilting') { shaft(-0.6, 0.6, 0.07, 5); tip(0.6, 0.07, 2); eye(-0.7, 0.18, 0.03, 0.07); }
  else if (t === 'darning') { shaft(-1.15, 1.1, 0.12, 7); tip(1.1, 0.12, 3); eye(-1.3, 0.34, 0.07, 0.12); }
  else if (t === 'embroidery') { shaft(-0.85, 0.85, 0.09, 6); tip(0.85, 0.09, 3); eye(-1.02, 0.34, 0.08, 0.1); }
  else if (t === 'tapestry') { shaft(-0.95, 1.0, 0.11, 6); ball(1.03, 0.13); eye(-1.12, 0.34, 0.07, 0.11); }
  else if (t === 'safety') { shaft(-0.9, 0.85, 0.06, 6, 0.13); shaft(-0.75, 0.85, 0.06, 6, -0.13); for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; part([0.06, 0.06, 0.06], -0.95 + Math.cos(a) * 0.13, Math.sin(a) * 0.13, accent(), 'Ball'); } part([0.24, 0.38, 0.12], 0.95, 0, accent()); }
  else if (t === 'knitting') { shaft(-1.45, 1.3, 0.18, 8); tip(1.3, 0.18, 4); ball(-1.6, 0.4); }
  else if (t === 'crochet') { shaft(-1.3, 1.1, 0.16, 7); part([0.6, 0.24, 0.1], -0.2, 0, accent()); part([0.22, 0.12, 0.12], 1.21, 0, colourAt(7, 7), 'Cylinder'); part([0.16, 0.07, 0.08], 1.28, 0.07, colourAt(7, 7), 'Block', -0.7); }
  else if (t === 'bodkin') { shaft(-1.1, 1.0, 0.2, 7, 0, 0.05); ball(1.05, 0.16); part([0.3, 0.06, 0.07], -0.85, 0, new THREE.Color(0.02, 0.02, 0.03)); }
  else if (t === 'curved') { const n = 9, r = 0.95; for (let i = 1; i <= n; i++) { const a = (20 + (i - 0.5) * 140 / n) * Math.PI / 180; part([r * (140 / n) * Math.PI / 180 + 0.02, 0.08, 0.08], -Math.cos(a) * r, Math.sin(a) * r - 0.5, colourAt(i, n), 'Cylinder', Math.PI / 2 - a, true); } const a0 = 20 * Math.PI / 180; ball(-Math.cos(a0) * r, 0.1, Math.sin(a0) * r - 0.5, true); }
  else if (t === 'sailmaker') { shaft(-1.2, 0.9, 0.14, 7); tip(0.9, 0.16, 3); part([1.6, 0.03, 0.03], -0.2, 0.08, accent()); eye(-1.36, 0.3, 0.07, 0.13); }
  else if (t === 'swordfish' || t === 'firework' || t === 'jackhammer' || t === 'shootingstar') {
    const R = (d) => d * Math.PI / 180;
    const pz = (size, x, y, z, ry, colour, shape, onCurve, keep) => { const m = part(size, x, y, colour, shape, 0, onCurve, keep); m.position.z = z; m.rotation.y = ry; return m; };
    const dark = (v) => new THREE.Color(v, v, v * 1.15);
    if (t === 'swordfish') {
      shaft(0.42, 1.55, 0.05, 6); tip(1.55, 0.05, 3);
      const body = [0.07, 0.15, 0.24, 0.3, 0.31, 0.27, 0.18, 0.1];
      body.forEach((d, k) => part([0.23, d, d * 0.75], -1.45 + (k + 1) * 0.23, 0, colourAt(k + 1, body.length), 'Cylinder'));
      for (let k = 0; k <= 5; k++) { const h = 0.6 - k * 0.09; part([0.16, h, 0.02], -0.08 - k * 0.12, 0.28 + h / 2, accent(), 'Block', R(-14), true, true); }
      for (const s of [-1, 1]) { part([0.55, 0.16, 0.02], -1.42, s * 0.2, accent(), 'Block', R(s * 58), true, true); part([0.28, 0.06, 0.02], -0.1, s * -0.18, accent(), 'Block', R(s * 25), true, true); }
      pz([0.07, 0.07, 0.07], 0.2, 0.06, 0.1, 0, dark(0.01), 'Ball', true);
    } else if (t === 'firework') {
      shaft(-1.65, -0.25, 0.05, 4);
      for (let k = 1; k <= 5; k++) part([0.22, 0.3, 0.3], -0.2 + k * 0.2, 0, colourAt(k, 5), 'Cylinder');
      for (let k = 1; k <= 4; k++) { const f = 1 - k / 5; part([0.09, 0.3 * f, 0.3 * f], 0.94 + k * 0.08, 0, accent(), 'Cylinder'); }
      for (const s of [-1, 1]) part([0.38, 0.34, 0.03], 0.0, s * 0.42, accent(), 'Block', R(s * -30), true, true);
      for (let k = 0; k < 6; k++) { const a = k / 6 * Math.PI * 2; part([0.07, 0.07, 0.07], -1.72 + Math.cos(a) * 0.16, Math.sin(a) * 0.16, new THREE.Color(1, 0.72, 0.19), 'Ball', 0, true, true); }
      ball(-1.72, 0.12);
    } else if (t === 'jackhammer') {
      shaft(0.45, 1.45, 0.08, 4); part([0.14, 0.14, 0.03], 1.52, 0, colourAt(4, 4));
      part([0.12, 0.22, 0.22], 0.4, 0, accent(), 'Cylinder');
      for (let k = 1; k <= 4; k++) { const d = k % 2 === 0 ? 0.36 : 0.4; part([0.26, d, d], 0.4 - k * 0.25, 0, colourAt(k, 4), 'Cylinder'); }
      part([0.4, 0.46, 0.4], -0.84, 0, accent()); part([0.22, 0.1, 0.1], -1.12, 0, accent());
      pz([1.1, 0.1, 0.1], -1.26, 0, 0, Math.PI / 2, dark(0.025), 'Cylinder', true, true);
      for (const s of [-1, 1]) pz([0.3, 0.18, 0.18], -1.26, 0, s * 0.45, Math.PI / 2, dark(0.012), 'Cylinder', true, true);
    } else {
      const n = 9;
      for (let k = 1; k <= n; k++) { const d = 0.03 + 0.1 * (k / n); part([2.2 / n + 0.01, d, d], -1.45 + (k - 0.5) * 2.2 / n, 0, colourAt(k, n), 'Cylinder'); }
      for (const s of [-1, 1]) part([1.2, 0.025, 0.025], 0.1, s * 0.12, colourAt(n, n), 'Cylinder', R(s * 4), true);
      for (let k = 0; k < 5; k++) { const a = R(90 + k * 72);
        part([0.5, 0.15, 0.07], 1.1 + Math.cos(a) * 0.25, Math.sin(a) * 0.25, accent(), 'Block', a, true, true);
        part([0.26, 0.26, 0.08], 1.1 + Math.cos(a) * 0.13, Math.sin(a) * 0.13, accent(), 'Block', a, true, true); }
      part([0.34, 0.34, 0.34], 1.1, 0, accent(), 'Ball', 0, true, true);
    }
  }
  else if (window.SHAPES && window.SHAPES[t]) {
    const KIND = { B: 'Block', C: 'Cylinder', S: 'Ball' }, D = Math.PI / 180;
    for (const op of window.SHAPES[t]) {
      if (op[0] === 's') shaft(op[1], op[2], op[3], op[4], op[5]);
      else if (op[0] === 't') tip(op[1], op[2], op[3]);
      else { const c = op[10];
        const colour = Array.isArray(c) ? lin(c) : c === 'a' ? accent() : colourAt(+c.slice(1).split('/')[0], +c.split('/')[1]);
        const m = part([op[1], op[2], op[3]], op[4], op[5], colour, KIND[op[11]], 0, op[12] % 2 === 1, op[12] >= 2);
        m.position.z = op[6]; m.rotation.set(op[7] * D, op[8] * D, op[9] * D); }
    }
  }
  else { shaft(-0.9, 0.85, 0.08, 6); tip(0.85, 0.08, 3); eye(-1.03, 0.24, 0.05, 0.09); }
  return group;
}
function render(typeId, skinId) {
  const scene = new THREE.Scene();
  scene.add(new THREE.HemisphereLight(0xffffff, 0x8890a0, 0.9));
  const sun = new THREE.DirectionalLight(0xffffff, 1.1); sun.position.set(-2, 3, 4); scene.add(sun);
  const env = new THREE.PMREMGenerator(renderer);
  const room = new THREE.Scene(); room.background = new THREE.Color(0x667088);
  scene.environment = env.fromScene(room).texture;
  const g = build(typeId, skinId); g.rotation.set(0.35, -0.25, 0.42); scene.add(g);
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 50); cam.position.set(0, 0.2, 5.4); cam.lookAt(0, 0, 0);
  renderer.render(scene, cam);
  return renderer.domElement.toDataURL('image/png');
}
window.render = render;
DATA = window.NEEDLE_DATA; window.READY = true;
</script></body></html>
