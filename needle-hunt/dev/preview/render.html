<script src="three.min.js"></script>

<script>{ const q = new URLSearchParams(location.search); if (q.get('json')) document.write('<script src="mapdata/' + q.get('map') + '.js"><\/script>'); }</script>
<script>
const q = new URLSearchParams(location.search);
const MAP = q.get('map') || 'field', VIEW = q.get('view') || 'aerial', W = +(q.get('w') || 1280), H = +(q.get('h') || 720);
const DEFS = {
  field: { straw: [226, 188, 92], ground: [104, 160, 76], L: { t: 14, b: 2.6, amb: [120, 116, 104], out: [150, 146, 134], fogEnd: 900, fog: [200, 225, 245] } },
  barn: { straw: [214, 172, 80], ground: [120, 86, 56], L: { t: 13, b: 1.4, amb: [120, 96, 70], out: [110, 90, 66], fogEnd: 400, fog: [120, 96, 70] } },
  sunset: { straw: [232, 170, 84], ground: [120, 150, 70], L: { t: 17.7, b: 2.2, amb: [130, 96, 80], out: [170, 120, 96], fogEnd: 700, fog: [250, 170, 120] } },
  forest: { straw: [196, 170, 100], ground: [52, 84, 52], L: { t: 0.5, b: 1.1, amb: [70, 80, 110], out: [90, 100, 140], fogEnd: 260, fog: [30, 40, 64] } },
  attic: { straw: [206, 176, 112], ground: [112, 86, 64], L: { t: 15, b: 1.2, amb: [110, 100, 90], out: [100, 92, 84], fogEnd: 300, fog: [110, 100, 90] } },
  lobby: { straw: [226, 188, 92], ground: [104, 160, 76], L: { t: 14.5, b: 2.5, amb: [120, 116, 104], out: [150, 146, 134], fogEnd: 1200, fog: [200, 225, 245] } },
};
// json=1: the map as the game's own Luau builds it (dev/maprun/run_map.py writes mapdata/<map>.js)
const MD = window.MAPDATA;
const def = MD ? { straw: MD.def.straw, ground: MD.def.ground, L: { t: MD.def.lighting.ClockTime, b: MD.def.lighting.Brightness, amb: MD.def.lighting.Ambient, out: MD.def.lighting.OutdoorAmbient, fogEnd: MD.def.lighting.FogEnd, fog: MD.def.lighting.FogColor } } : DEFS[MAP];
window.BOOTHS = { 5: ['StrawBossMax', '5,906'], 4: ['Clover_99', '1,120'], 11: ['You', '2,418'], 10: ['MeadowMia', '640'] };
const c3 = (c) => new THREE.Color(c[0] / 255, c[1] / 255, c[2] / 255).convertSRGBToLinear();
const ctx = { parts: [], rng: NH.rng(+(q.get('seed') || 11)), centre: new THREE.Vector3(0, 0, 0), def, spots: [], spawns: [], floorY: 0, diff: { clutter: 260, moving: 0, needle: 2.8 } };
if (MD) {
  for (const q2 of MD.parts) { const r = q2.rot, m = new THREE.Matrix4().set(r[0], r[1], r[2], q2.pos[0], r[3], r[4], r[5], q2.pos[1], r[6], r[7], r[8], q2.pos[2], 0, 0, 0, 1);
    ctx.parts.push({ size: q2.size, m, color: q2.color, material: q2.material, shape: q2.shape, transparency: q2.transparency, name: q2.name, light: q2.light }); }
  for (const s2 of MD.spawns) ctx.spawns.push(new THREE.Vector3(s2[0], s2[1], s2[2]));
  ctx.spots.push({ p: new THREE.Vector3(0, -50, 0) });
} else NH.B[MAP](ctx);

// the needle: a spot from the map's list, nudged and turned, like NeedleSpawner (normal difficulty)
const nr = NH.rng(+(q.get('needleSeed') || 5));
const usable = ctx.spots.filter(s => !s.climb || MAP === 'barn');
const spot = usable[nr.NextInteger(0, usable.length - 1)];
const np = spot.p.clone().add(new THREE.Vector3((nr.NextNumber() - 0.5) * 1.2, 0.06, (nr.NextNumber() - 0.5) * 1.2));
const needleTurn = nr.NextNumber() * Math.PI * 2;
if (MAP !== 'lobby' && !MD) {
  const m = NH.mul(NH.cf(np.x, np.y, np.z), NH.ang(0, needleTurn, 0));
  ctx.parts.push({ size: [ctx.diff.needle, 0.2, 0.2], m, color: [205, 210, 220], material: 'Metal', shape: 'Cylinder', name: 'Needle' });
  if (VIEW === 'needle') ctx.parts.push({ size: [ctx.diff.needle + 0.12, 0.34, 0.34], m, color: [255, 255, 255], material: 'Neon', shape: 'Cylinder', name: 'Glow', transparency: 0.55 });
  ctx.parts.push({ size: [0.35, 0.12, 0.32], m: NH.mul(m, NH.cf(-ctx.diff.needle / 2 + 0.17, 0, 0)), color: [154, 158, 165], material: 'Metal', shape: 'Block', name: 'Eye' });
}

// simple procedural textures
function tex(kind, base) {
  const cv = document.createElement('canvas'); cv.width = cv.height = 128; const g = cv.getContext('2d');
  g.fillStyle = '#fff'; g.fillRect(0, 0, 128, 128);
  const r = NH.rng(kind.length * 31);
  if (kind === 'Grass') for (let i = 0; i < 900; i++) { const v = 200 + r.NextNumber() * 55 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(r.NextNumber() * 128, r.NextNumber() * 128, 2, 3); }
  if (kind === 'WoodPlanks') { for (let y = 0; y < 128; y += 16) { g.fillStyle = 'rgba(0,0,0,0.22)'; g.fillRect(0, y, 128, 2); const o = (y / 16 % 2) * 64; g.fillRect(o + 30, y, 2, 16); } for (let i = 0; i < 200; i++) { g.fillStyle = 'rgba(0,0,0,0.05)'; g.fillRect(r.NextNumber() * 128, r.NextNumber() * 128, 20, 1); } }
  if (kind === 'Wood') for (let i = 0; i < 120; i++) { g.fillStyle = 'rgba(0,0,0,0.08)'; g.fillRect(0, r.NextNumber() * 128, 128, 1); }
  if (kind === 'Slate' || kind === 'Fabric') for (let i = 0; i < 400; i++) { const v = 215 + r.NextNumber() * 40 | 0; g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(r.NextNumber() * 128, r.NextNumber() * 128, 3, 3); }
  const t = new THREE.CanvasTexture(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}
const texCache = {};
function signTex(kind) {
  const cv = document.createElement('canvas'); const g = cv.getContext('2d');
  if (kind === 'title') { cv.width = 1200; cv.height = 270; }
  else if (kind === 'hall') { cv.width = 1400; cv.height = 260; }
  else if (kind === 'leaderboard') { cv.width = 540; cv.height = 480; } else { cv.width = 540; cv.height = 360; }
  g.fillStyle = '#785432'; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = '#1e222c'; g.beginPath(); g.roundRect(12, 12, cv.width - 24, cv.height - 24, 18); g.fill();
  g.textAlign = 'center'; g.font = 'bold 40px sans-serif';
  if (kind === 'title') {
    g.fillStyle = '#ffd65a'; g.font = 'bold 96px sans-serif'; g.fillText('A NEEDLE IN A HAYSTACK', 600, 145);
    g.fillStyle = '#dce2f0'; g.font = '48px sans-serif'; g.fillText('Find it first. Win the round.', 600, 225);
  } else if (kind === 'hall') {
    g.fillStyle = '#ffd65a'; g.font = 'bold 150px sans-serif'; g.fillText('HALL OF NEEDLES', 700, 185);
  } else if (kind === 'leaderboard') {
    g.fillStyle = '#ffd65a'; g.fillText('Most Needles', 270, 64); g.textAlign = 'left'; g.font = '30px sans-serif'; g.fillStyle = '#fff';
    ['HayDayHannah  ·  412', 'StrawBossMax  ·  388', 'Clover_99  ·  301', 'NeedleNinja  ·  256', 'MeadowMia  ·  199', 'BaleBuilder  ·  170', 'FarmerFinn22  ·  151'].forEach((t, i) => g.fillText((i + 1) + '.  ' + t, 36, 120 + i * 48));
  } else {
    g.fillStyle = '#ffd65a'; g.fillText('DAILY CHALLENGE', 270, 70); g.textAlign = 'left'; g.font = '28px sans-serif'; g.fillStyle = '#fff';
    ['• Find 5 needles  (+150 coins)', '• Win a round  (+80 coins)', '• Complete a Hard round  (+100)'].forEach((t, i) => g.fillText(t, 30, 150 + i * 70));
  }
  return new THREE.CanvasTexture(cv);
}
function boothTex(who) {
  const cv = document.createElement('canvas'); cv.width = 660; cv.height = 156; const g = cv.getContext('2d');
  g.fillStyle = '#603f28'; g.fillRect(0, 0, 660, 156); g.fillStyle = '#1e222c'; g.fillRect(6, 6, 648, 144);
  g.textAlign = 'center'; g.fillStyle = '#ffd65a'; g.font = 'bold 52px sans-serif';
  g.fillText(who ? who[0] + "'s collection" : 'Free booth', 330, 72);
  g.fillStyle = '#fff'; g.font = '34px sans-serif'; g.fillText(who ? who[1] + ' value  ·  press E to look' : "Join and it's yours", 330, 125);
  return new THREE.CanvasTexture(cv);
}
function tagSprite(lines, pos, scale) {
  const cv = document.createElement('canvas'); cv.width = 1000; cv.height = 64 * lines.length; const g = cv.getContext('2d');
  g.textAlign = 'center'; g.lineWidth = 9; g.strokeStyle = 'rgba(0,0,0,0.55)';
  lines.forEach(([txt, col, size], i) => { g.font = `bold ${size || 40}px sans-serif`; g.strokeText(txt, 500, 48 + i * 60); g.fillStyle = col; g.fillText(txt, 500, 48 + i * 60); });
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: true }));
  sp.scale.set(scale * 1000 / 64 / 2.2, scale * lines.length / 2.2, 1); sp.position.copy(pos); scene.add(sp);
}
function avatar(x, z, shirt, faceAngle) {
  const g = new THREE.Group(); const box = (w, h, d, y, c, dx) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color: new THREE.Color(...c.map(v => v / 255)).convertSRGBToLinear(), roughness: 0.8 })); m.position.set(dx || 0, y, 0); m.castShadow = true; g.add(m); };
  box(1, 2, 1, 1, [60, 70, 110], -0.5); box(1, 2, 1, 1, [60, 70, 110], 0.5); box(2, 2, 1, 3, shirt); box(1, 2, 1, 3, [245, 205, 160], -1.5); box(1, 2, 1, 3, [245, 205, 160], 1.5); box(1.2, 1.2, 1.2, 4.6, [245, 205, 160]);
  g.position.set(x, 0.4, z); g.rotation.y = faceAngle || 0; scene.add(g); return g;
}
function labelTex(text, bg) {
  const cv = document.createElement('canvas'); cv.width = 512; cv.height = 256; const g = cv.getContext('2d');
  g.fillStyle = bg; g.fillRect(0, 0, 512, 256); g.fillStyle = '#fff'; g.font = 'bold 90px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText(text, 256, 128);
  return new THREE.CanvasTexture(cv);
}

const scene = new THREE.Scene();
const L = def.L;
scene.fog = new THREE.Fog(c3(L.fog), L.fogEnd * 0.25, L.fogEnd);
const night = L.t < 6 || L.t > 18.5;
const sky = night ? [18, 24, 44] : L.t > 17 ? [250, 176, 120] : [150, 196, 238];
scene.background = c3(sky);
scene.add(new THREE.HemisphereLight(c3(L.out), c3(L.amb), 0.55 * L.b / 2 + 0.25));
const sunAngle = (L.t - 6) / 12 * Math.PI;
const elev = night ? 0.6 : Math.max(0.12, Math.sin(sunAngle));
const sun = new THREE.DirectionalLight(night ? 0x8fa6ff : (L.t > 17 ? 0xffb07a : 0xfff2dc), night ? 0.35 : 0.55 * L.b);
sun.position.set(Math.cos(sunAngle) * 100, elev * 120, 60);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -110, right: 110, top: 110, bottom: -110, far: 400 });
scene.add(sun);

const wedge = (() => { // a Roblox wedge: the slope faces -Z, rising to the top at +Z
  const g = new THREE.BufferGeometry(), A = [-0.5, -0.5, -0.5], B = [-0.5, -0.5, 0.5], C = [-0.5, 0.5, 0.5], D = [0.5, -0.5, -0.5], E = [0.5, -0.5, 0.5], F = [0.5, 0.5, 0.5];
  const tri = [A, C, B, D, E, F, A, B, E, A, E, D, B, C, F, B, F, E, A, D, F, A, F, C];
  g.setAttribute('position', new THREE.Float32BufferAttribute(tri.flat(), 3)); g.computeVertexNormals(); return g; })();
const geo = { Wedge: wedge, Block: new THREE.BoxGeometry(1, 1, 1), Ball: new THREE.SphereGeometry(0.5, 24, 16), Cylinder: new THREE.CylinderGeometry(0.5, 0.5, 1, 24).rotateZ(-Math.PI / 2) };
let lights = 0;
const hideNames = (VIEW === 'aerial' || VIEW === 'top') && (MAP === 'barn' || MAP === 'attic') ? ['Roof', 'Loft'] : [];
for (const p of ctx.parts) {
  if (hideNames.includes(p.name)) continue;
  if ((p.transparency || 0) >= 1) continue; // invisible walls (the map's edge) aren't drawn
  if ((VIEW === 'aerial' || VIEW === 'top') && MAP === 'barn' && p.name === 'BarnWall' && NH.pos(p.m).z > 0) continue;
  if (VIEW === 'aerial' && MAP === 'attic' && p.name === 'Wall' && NH.pos(p.m).z > 10) continue;
  if (p.shape === 'Dome') { // smooth terrain: a lumpy, soft dome with a straw texture
    const [radius, domeY] = p.size, pts = [];
    for (let i = 0; i <= 8; i++) pts.push(new THREE.Vector2(radius * (1.04 - 0.04 * i / 8), domeY * i / 8));
    for (let i = 1; i <= 16; i++) { const a = i / 16 * Math.PI / 2; pts.push(new THREE.Vector2(Math.max(0.001, radius * Math.cos(a)), domeY + radius * Math.sin(a))); }
    const geom = new THREE.LatheGeometry(pts, 48);
    const pos = geom.attributes.position, v = new THREE.Vector3(), rn = NH.rng(Math.round(radius * 100 + domeY * 7));
    const seeds = [0, 1, 2, 3].map(() => [rn.NextNumber() * 6, rn.NextNumber() * 6]);
    for (let i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i); const ang = Math.atan2(v.z, v.x), h = v.y;
      const n = 1 + 0.06 * Math.sin(ang * 3 + seeds[0][0] + h * 0.3) + 0.04 * Math.sin(ang * 7 + seeds[1][0] + h * 0.6);
      v.x *= n; v.z *= n; pos.setXYZ(i, v.x, v.y, v.z); }
    geom.computeVertexNormals();
    texCache.Hay = texCache.Hay || (() => { const cv = document.createElement('canvas'); cv.width = cv.height = 256; const g2 = cv.getContext('2d'); g2.fillStyle = '#fff'; g2.fillRect(0, 0, 256, 256); const r2 = NH.rng(5);
      for (let k = 0; k < 2200; k++) { const x = r2.NextNumber() * 256, y = r2.NextNumber() * 256, a = (r2.NextNumber() - 0.5) * 1.4, l = 6 + r2.NextNumber() * 18, sh = 170 + r2.NextNumber() * 85 | 0; g2.strokeStyle = `rgb(${sh},${sh},${sh})`; g2.lineWidth = 1.4; g2.beginPath(); g2.moveTo(x, y); g2.lineTo(x + Math.cos(a) * l, y + Math.sin(a) * l); g2.stroke(); }
      const tx = new THREE.CanvasTexture(cv); tx.wrapS = tx.wrapT = THREE.RepeatWrapping; tx.repeat.set(4, 2); return tx; })();
    const hm = new THREE.MeshStandardMaterial({ color: c3(p.color), roughness: 0.95, map: texCache.Hay });
    const mesh = new THREE.Mesh(geom, hm); mesh.applyMatrix4(p.m); mesh.castShadow = mesh.receiveShadow = true; scene.add(mesh);
    for (const b of p.bulges) { const bm = new THREE.Mesh(new THREE.SphereGeometry(b[3], 24, 16), hm); bm.scale.y = 0.8; bm.position.copy(NH.pos(p.m)).add(new THREE.Vector3(b[0], b[1], b[2])); bm.castShadow = bm.receiveShadow = true; scene.add(bm); }
    continue;
  }
  const mat = { color: c3(p.color), roughness: 0.85, metalness: 0 };
  if (['Grass', 'WoodPlanks', 'Wood', 'Slate', 'Fabric'].includes(p.material)) { texCache[p.material] = texCache[p.material] || tex(p.material); mat.map = texCache[p.material]; }
  if (p.material === 'Metal') { mat.metalness = 0.75; mat.roughness = 0.3; }
  if (p.material === 'Neon') { mat.emissive = c3(p.color); mat.emissiveIntensity = 1.0; }
  if (p.transparency) { mat.transparent = true; mat.opacity = 1 - p.transparency; }
  let material = new THREE.MeshStandardMaterial(mat);
  if (p.sign) { const sideM = material; const face = new THREE.MeshStandardMaterial({ map: signTex(p.sign), roughness: 0.9 }); material = [sideM, sideM, sideM, sideM, sideM, face]; }
  if (p.name === 'BoothSign') { const sideM = material; const who = (window.BOOTHS || [])[p.booth]; const face = new THREE.MeshStandardMaterial({ map: boothTex(who), roughness: 0.9 }); material = [sideM, sideM, sideM, sideM, sideM, face]; }
  if (p.label) { const sideM = material; const face = new THREE.MeshStandardMaterial({ map: labelTex(p.label, '#' + c3(p.color).getHexString()), roughness: 0.9 }); material = [sideM, sideM, face, sideM, sideM, sideM]; }
  if (p.shape === 'Wedge') (Array.isArray(material) ? material : [material]).forEach(mm => mm.side = THREE.DoubleSide);
  const mesh = new THREE.Mesh(geo[p.shape] || geo.Block, material);
  mesh.applyMatrix4(new THREE.Matrix4().makeScale(...p.size));
  mesh.applyMatrix4(p.m);
  mesh.castShadow = p.name !== 'Straw' && p.name !== 'Ground'; mesh.receiveShadow = true;
  scene.add(mesh);
  if (p.light && lights < 8) { lights++; const l = new THREE.PointLight(c3(p.light.color), 1.4, p.light.range * 1.6, 1.5); l.position.copy(NH.pos(p.m)); scene.add(l); }
}
if (MAP === 'lobby' && ctx.hall) { // the Hall of Needles: the best collection in the middle
  const shown = { 1: ['sailmaker', 'prism', 'StrawBossMax', '5,906'], 0: ['darning', 'aurora', 'You', '2,418'], 2: ['knitting', 'candycane', 'Clover_99', '1,120'] };
  for (const slot of ctx.hall) {
    const [type, skin, who, value] = shown[slot.slot];
    const g = buildNeedle(window.NEEDLE_DATA, type, skin, 2);
    g.scale.setScalar(1.5); g.position.copy(slot.top); g.rotation.set(0, [0.35, 0.25, -0.3][slot.slot], 20 * Math.PI / 180, 'YXZ');
    g.traverse(o => { if (o.isMesh) o.castShadow = true; });
    scene.add(g);
    const cv = document.createElement('canvas'); cv.width = 480; cv.height = 140; const c2 = cv.getContext('2d');
    c2.textAlign = 'center'; c2.lineWidth = 10; c2.strokeStyle = 'rgba(0,0,0,0.45)'; c2.fillStyle = '#fff';
    c2.font = 'bold 50px sans-serif'; c2.strokeText(who, 240, 58); c2.fillText(who, 240, 58);
    c2.font = 'bold 38px sans-serif'; c2.strokeText(value + ' collection value', 240, 112); c2.fillText(value + ' collection value', 240, 112);
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false })); sp.scale.set(6.4, 1.9, 1); sp.position.copy(slot.tag); scene.add(sp);
  }
}
if (MAP === 'lobby' && ctx.booths) { // people: booths, the champion, players and their tags
  const N = window.NEEDLE_DATA;
  const owners = { 5: ['StrawBossMax', '5,906', [['sailmaker', 'prism'], ['knitting', 'phoenix'], ['curved', 'galaxy']]], 4: ['Clover_99', '1,120', [['crochet', 'aurora'], ['pin', 'ember'], ['sewing', 'jade']]],
                   11: ['You', '2,418', [['darning', 'aurora'], ['knitting', 'candycane'], ['safety', 'frost']]], 10: ['MeadowMia', '640', [['embroidery', 'sakura'], ['pin', 'rosegold'], ['sewing', 'brass']]] };
  // the booth signs were drawn before we knew: redraw them
  scene.traverse(o => { if (o.isMesh && Array.isArray(o.material) && o.userData.booth !== undefined) {} });
  for (const b of ctx.booths) {
    const own = owners[b.i]; if (!own) continue;
    own[2].forEach(([ty, sk], slot) => {
      const g = buildNeedle(N, ty, sk, 2); g.scale.setScalar(1.35); const m = NH.mul(b.face, NH.cf((slot - 1) * 3.1, 4.4, -1), NH.ang(0, Math.PI / 2, 50 * Math.PI / 180));
      g.applyMatrix4(m); scene.add(g);
    });
  }
  const champ = buildNeedle(N, 'sailmaker', 'prism', 2); champ.scale.setScalar(3); champ.position.copy(ctx.champion); champ.rotation.set(0, 0.4, 25 * Math.PI / 180, 'YXZ'); scene.add(champ);
  const cl = new THREE.PointLight(0xffc8ff, 1.6, 22); cl.position.copy(ctx.champion); scene.add(cl);
  tagSprite([['MOST VALUABLE NEEDLE HERE', '#ffcd46', 44], ['Mythic Prism Sailmaker\'s Needle', '#ff6eaa', 40], ['owned by StrawBossMax  ·  worth 5,400', '#ffffff', 34]], new THREE.Vector3(0, 13.5, 48), 1.9);
  const people = [[8, 40, [196, 64, 50], 'StrawBossMax', ['♛ MOST VALUABLE NEEDLE', '#ffcd46', 40], ['Best: Mythic Prism Sailmaker\'s Needle · 5,400', '#ff6eaa', 34]],
                  [-14, 38, [76, 106, 170], 'You', null, ['Best: Epic Candy Cane Knitting Needle · 264', '#aa6ef0', 34]],
                  [-56, 28, [96, 160, 90], 'Clover_99', null, ['Best: Epic Aurora Crochet Hook · 288', '#aa6ef0', 34]],
                  [20, 22, [230, 160, 60], 'MeadowMia', null, ['Best: Rare Sakura Embroidery Needle · 80', '#5a96f0', 34]]];
  for (const [x, z, shirt, name, crown, best] of people) {
    avatar(x, z, shirt, Math.atan2(-x, -(z - 48)) + Math.PI);
    const lines = []; if (crown) lines.push(crown); lines.push(best);
    tagSprite(lines, new THREE.Vector3(x, 7.4 + (crown ? 0.6 : 0), z), 1.2);
  }
  // MeadowMia is showing off
  const sh = buildNeedle(N, 'embroidery', 'sakura', 2); sh.scale.setScalar(1.6); sh.position.set(20, 8.5, 22); sh.rotation.set(0, 0, 80 * Math.PI / 180); scene.add(sh);
}
if (MAP === 'lobby') { // the countdown above the Play pad
  const cv = document.createElement('canvas'); cv.width = 840; cv.height = 240; const g = cv.getContext('2d');
  g.font = 'bold 84px sans-serif'; g.textAlign = 'center'; g.lineWidth = 12; g.strokeStyle = 'rgba(0,0,0,0.5)'; g.strokeText('NEXT ROUND IN 0:12', 420, 150); g.fillStyle = '#fff'; g.fillText('NEXT ROUND IN 0:12', 420, 150);
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false })); s.scale.set(14, 4, 1); s.position.set(0, 5, 6); scene.add(s);
}

const camera = new THREE.PerspectiveCamera(70, W / H, 0.1, 2000);
